# Lausanne Rental Watcher configuration

# Reference point for the walk-time criterion: Lausanne train station
station:
  lat: 46.5170
  lon: 6.6291

# Criteria that trigger an immediate (loud) Telegram push.
# All listed criteria must match.
#
# Two of these reject a listing whose value is simply unknown, because they are
# what defines the search rather than a bound on it: zip_codes and rooms. The
# rest only reject a figure the portal actually published — agencies routinely
# withhold the rent ("prix sur demande"), and treating that as a failure would
# silently drop those flats.
push_criteria:
  # Sous-Gare / Ouchy / Montriond. immobilier.ch publishes no NPA on its search
  # cards, so its listings get one fetched from the detail page before this is
  # applied — see scrapers/immobilier_ch.py:enrich.
  zip_codes: ["1006", "1007"]

  # Swiss "pièces" counts the living room, so 3.5 pces ≈ 2 bedrooms.
  rooms: [3.5]

  # "Around 80 m²", kept wide on purpose: portals round, and the same flat is
  # listed at 76 and at 93 by two different agencies.
  min_surface: 70
  max_surface: 95

  max_price: 2800

  # Only rejects a *confirmed* rez-de-chaussée. The floor is unknown for a
  # minority of listings; those still push, flagged "étage inconnu", because a
  # missed flat costs more than one extra ping.
  exclude_ground_floor: true

  # Dropped: the zip codes now define the area, and a walk bound only cut into
  # 1007 (Malley/Bourdonnette) without excluding anything unwanted. Still
  # implemented, still computed, still shown in the message — uncomment to
  # bring it back as a filter.
  # max_walk_minutes: 20

alerting:
  # Portals publish a date for most listings; anything older than this was
  # simply not indexed yet rather than newly posted, so it must not buzz.
  max_listing_age_days: 3
  # Backstop for sources that publish no date (immobilier.ch): however badly a
  # source churns, one run can never send more than this many pushes.
  max_alerts_per_source_run: 15

# Straight-line prefilter: beyond this distance (km) from the station we
# don't even call the routing API (20 min walk can never reach it).
haversine_cutoff_km: 2.2

# Hard region boundary. Anything further from the station than this is not part
# of the search and is discarded at ingest — a portal that silently widens a
# search (immobilier.ch does this for unknown commune slugs) cannot pollute the
# database. Generous enough to cover the whole agglomeration.
max_distance_km: 12

# Sources to scan. Comment out a line to disable a scraper.
sources:
  - flatfox          # SMG network; ~54% of its listings carry an smg_id
  - immobilier_ch    # Romandie régies; ships lat/lng in the markup
  - acheter_louer    # syndicates Homegate inventory
  - petitesannonces  # private landlords, not on the portals
  - comparis         # aggregator; the only source that states the floor outright

# Deliberately NOT scraped — all sit behind DataDome/Cloudflare bot walls that
# need a real browser on a residential IP, which a CI runner is not (re-verified
# 2026-08-18: every one still answers 403):
#   homegate, immoscout24  -> reached indirectly via acheter_louer, flatfox and
#                             comparis, which all resell their inventory
#   anibis, tutti, newhome -> no viable path; accepted coverage gap
