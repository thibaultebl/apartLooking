name: recap

# Sends the daily digest of everything new in the last 24 h.
# Read-only with respect to state, so it never contends with `scan`.
on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 CEST / 07:00 CET
  workflow_dispatch:

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        run: bash scripts/state.sh restore

      - name: Send recap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m watcher.main recap
