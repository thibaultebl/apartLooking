name: scan

# Scrapes every 30 minutes during waking hours, resolves and stores what is new,
# and sends nothing: the sole notification is the 19:00 digest in recap.yml.
#
# The cadence is not about latency any more, it is about coverage — comparis only
# ever returns its newest 10 listings per request, so a slower scan silently
# loses listings on a busy day.
on:
  schedule:
    - cron: "*/30 5-21 * * *"   # UTC — roughly 07:00–23:00 CEST
  workflow_dispatch:

# Never let two scans (or a scan and a state save) race on the state branch.
concurrency:
  group: watcher-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        run: bash scripts/state.sh restore

      # No Telegram credentials here on purpose: `scan` sends nothing, and a job
      # that cannot reach Telegram cannot leak the token either.
      - name: Scan
        run: python -m watcher.main scan

      - name: Save state
        if: always()   # keep whatever was scraped even if a source blew up
        run: bash scripts/state.sh save
